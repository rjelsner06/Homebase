<style>
/* Layout: one phone-width column; sticky tab bar on top, rest timer pinned to the bottom. Chalk-and-rubber palette, cobalt (20 kg plate) accent, red (25 kg plate) for PRs. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#e4e9ef; --ink:#141b24; --muted:#586473; --line:#d3dae2;
  --accent:#1f4fd1; --accent-ink:#ffffff; --accent-soft:#dde6fb;
  --good:#1d7f47; --good-soft:#dcf1e4; --pr:#c4302b; --pr-soft:#fbe3e1; --amber:#9a6412; --amber-soft:#f8ecd6;

  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111418; --surface:#1a1f25; --surface-2:#242a31; --ink:#e8ecf1; --muted:#9aa5b2; --line:#2f3741;
  --accent:#7398ff; --accent-ink:#0b1220; --accent-soft:#1c2948;
  --good:#52c585; --good-soft:#15301f; --pr:#ff7b6f; --pr-soft:#3a1e1b; --amber:#e3ab52; --amber-soft:#35290f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111418; --surface:#1a1f25; --surface-2:#242a31; --ink:#e8ecf1; --muted:#9aa5b2; --line:#2f3741;
  --accent:#7398ff; --accent-ink:#0b1220; --accent-soft:#1c2948;
  --good:#52c585; --good-soft:#15301f; --pr:#ff7b6f; --pr-soft:#3a1e1b; --amber:#e3ab52; --amber-soft:#35290f; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 140px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header + tabs */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;text-transform:uppercase}
.sync{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.sync[data-s="saving"] i{background:var(--amber)}
.sync[data-s="offline"] i{background:var(--pr)}
.sync[data-s="local"] i{background:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);border-radius:10px;padding:4px;margin-top:10px}
.tabs button{border:0;background:transparent;padding:8px 0;border-radius:7px;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.banner{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--amber-soft);color:var(--ink);font-size:14px}

/* day picker */
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}

.daypick{display:flex;gap:6px}
.daypick button{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:700;font-size:22px}
.daypick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.daypick button:disabled{opacity:.45;cursor:not-allowed}
.meta{margin-top:8px;font-size:14px;color:var(--muted)}

/* exercise cards */
.list{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.ex.done{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exhead h3{margin:0;font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1;text-transform:uppercase;letter-spacing:.01em}
.exhead .alt{font-size:13px;color:var(--muted);margin-top:2px}
.target{font-family:var(--display);font-weight:600;font-size:18px;white-space:nowrap;text-align:right}
.target span{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.last{margin-top:8px;font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.02em}
.chip.up{background:var(--accent-soft);color:var(--accent)}
.chip.pr{background:var(--pr-soft);color:var(--pr)}
.chip.ok{background:var(--good-soft);color:var(--good)}

.sets{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.row{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;min-height:44px}
.sn{font-family:var(--display);font-weight:700;font-size:17px;color:var(--muted);text-align:center}
.logged .sn{color:var(--good)}
.logged .val{font-family:var(--display);font-weight:600;font-size:21px}
.logged .val small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:500}
.logged .valwrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.undo{border:0;background:transparent;color:var(--muted);font-size:13px;padding:8px 6px;text-decoration:underline;text-underline-offset:2px}
.planned{opacity:.5}
.planned .val{font-family:var(--display);font-weight:500;font-size:18px}

.inputs{display:flex;gap:8px;flex-wrap:wrap;min-width:0}
.field{display:flex;align-items:center;background:var(--surface-2);border-radius:10px;overflow:hidden}
.field button{border:0;background:transparent;width:34px;height:44px;font-size:20px;font-weight:600;color:var(--muted)}
.field button:active{background:var(--line)}
.field label{display:flex;flex-direction:column;align-items:center}
.field input{width:56px;border:0;background:transparent;text-align:center;font-family:var(--display);font-weight:700;font-size:22px;color:var(--ink);padding:0;line-height:1}
.field input::placeholder{color:var(--muted);opacity:.6}
.field .u{font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;line-height:1;margin-top:1px}
.log{width:52px;height:44px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-size:22px;font-weight:700}
.log:active{transform:scale(.96)}
.addset{margin-top:8px;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-size:14px;color:var(--muted);width:100%}
.err{color:var(--pr);font-size:13px;margin-top:4px}

.finish{margin-top:18px;width:100%;padding:14px;border-radius:var(--r);border:0;background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.finish:disabled{opacity:.35;cursor:not-allowed}

/* summary */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:16px}
.card h2{margin:0 0 4px;font-family:var(--display);font-weight:700;font-size:26px;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:12px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14.5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--pr);border-color:color-mix(in srgb,var(--pr) 40%,var(--line))}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.prlist{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14.5px}

/* progress */
.sel{width:100%;margin-top:16px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:3px;margin-top:14px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chart{margin-top:10px;width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;max-width:100%}
.empty{color:var(--muted);font-size:14.5px;padding:18px 4px}
.weeks{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:12px}
.wk{display:flex;flex-direction:column;gap:3px;align-items:center}
.wk i{width:100%;max-width:22px;aspect-ratio:1;border-radius:5px;background:var(--surface-2);display:block}
.wk i.on{background:var(--accent)}
.wk i.over{background:var(--good)}
.wk span{font-size:10px;color:var(--muted)}
.h2{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em;margin:22px 0 0}

/* history */
.hist{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.hitem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.hsum{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:12px 14px}
.hday{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:22px}
.hdate{font-weight:600}
.hsub{font-size:13px;color:var(--muted)}
.hvol{font-family:var(--display);font-weight:600;font-size:18px;text-align:right}
.hvol span{display:block;font-family:var(--body);font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.hdetail{padding:0 14px 14px;border-top:1px solid var(--line)}
.hlifts{display:flex;flex-direction:column;margin-top:4px}
.hlift{border-bottom:1px solid var(--line)}
.hlift:last-child{border-bottom:0}
.hlhead{display:grid;grid-template-columns:1fr auto 20px;gap:10px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:10px 0}
.hlname{font-family:var(--display);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.01em;min-width:0}
.hlsum{font-size:12.5px;color:var(--muted);white-space:nowrap}
.hlnote{color:var(--accent);font-weight:600}
.hlcar{font-size:18px;font-weight:600;color:var(--accent);text-align:center}
.hsets{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px;padding-bottom:10px}
.hset{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:8px;padding:6px 10px;flex-wrap:wrap}
.hsn{font-family:var(--display);font-weight:700;font-size:14px;color:var(--good);min-width:10px}
.hval{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.1}
.hval small{font-family:var(--body);font-size:11px;color:var(--muted);font-weight:500;margin-left:2px}
.hset .chip{padding:1px 6px;font-size:11px}
.hlift .note{margin-bottom:12px}
.note{display:block;width:100%;margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font:inherit;font-size:14.5px;line-height:1.4;resize:vertical;min-height:44px}
.note::placeholder{color:var(--muted)}
.addnote{margin-top:8px;border:0;background:transparent;color:var(--accent);font-size:14px;font-weight:600;padding:6px 0}
.lastnote{margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--accent-soft)}
.lastnote .eyebrow{font-size:11px;color:var(--accent)}
.lastnote p{margin:2px 0 0;font-size:14.5px;white-space:pre-wrap}

/* rest timer */
.rest{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.restin{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.restlbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.restrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rest .snd{padding:2px 8px;font-size:11.5px;border-radius:999px;letter-spacing:.04em}
.rest .snd[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.flash{position:fixed;inset:0;z-index:25;background:var(--good);pointer-events:none;opacity:0}
@media (prefers-reduced-motion:no-preference){.flash{animation:flashit 1.6s ease-out}@keyframes flashit{0%,40%{opacity:.55}20%,60%{opacity:.15}100%{opacity:0}}}
@media (prefers-reduced-motion:reduce){.flash{opacity:.3}}
.padd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-bottom:10px}
.padd input{width:64px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-family:var(--display);font-weight:700;font-size:18px;text-align:center}
.padd span{font-size:13px;color:var(--muted)}
.padd .btn{padding:8px 12px}
.hset .x{border:0;background:transparent;color:var(--muted);font-size:15px;padding:2px 4px;margin-left:auto;line-height:1}
.hset .x.arm{color:var(--pr);font-size:12px;font-weight:700}
.addex{width:100%;margin-top:6px;padding:10px;border-radius:10px;border:1px dashed var(--line);background:transparent;color:var(--accent);font:inherit;font-weight:600;font-size:14px}
.pform{display:flex;flex-direction:column;gap:12px}
.pform label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.pform input[type=date]{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit;font-size:16px;max-width:220px}
.resttime{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.restbar{height:4px;background:color-mix(in srgb,var(--bg) 25%,transparent);border-radius:2px;margin-top:6px;overflow:hidden}

.rest.done .resttime{color:var(--good)}
.rest .grow{flex:1;min-width:0}
.rest button{border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);background:transparent;color:var(--bg);border-radius:9px;padding:8px 10px;font-weight:600;font-size:14px}

.vseg{display:inline-flex;flex-wrap:wrap;gap:3px;background:var(--surface-2);border-radius:9px;padding:3px;margin-top:8px}
.vseg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);min-height:32px}
.vseg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.vseg button:disabled{opacity:.4;cursor:not-allowed}
.bk{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.bkst{font-size:13.5px;color:var(--muted);min-width:0;flex:1 1 200px}
.bkst.ok{color:var(--good);font-weight:600}
.bkst.bad{color:var(--pr)}
.bkst a{color:var(--accent)}
.gym{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.gym a{display:flex;flex-direction:column;gap:1px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;min-width:0}
.gym a:hover{border-color:var(--accent)}
.gym a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gym b{font-family:var(--display);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.02em}
.gym span{font-size:12.5px;color:var(--accent);font-weight:600}
@media (max-width:360px){.gym{grid-template-columns:1fr}}
.wu{padding:0}
.wu summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px}
.wu summary::-webkit-details-marker{display:none}
.wut{display:block;font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;line-height:1.1}
.wuc{font-size:13px;font-weight:600;color:var(--accent)}
.wus{margin:0;padding:0 16px 4px 36px;display:flex;flex-direction:column;gap:14px}
.wus>li{padding-left:2px}
.wus>li::marker{font-family:var(--display);font-weight:700;color:var(--accent)}
.wus b{font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.wus p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.wum{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.wum li{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;border-bottom:1px solid var(--line);padding-bottom:6px}
.wum li span{min-width:0}
.wum small{display:block;font-size:12.5px;color:var(--muted)}

.ramp span{background:var(--surface-2);border-radius:8px;padding:5px 10px;font-family:var(--display);font-weight:600;font-size:17px}

</style>

<div class="wrap">
  <header class="top">
    <div class="brand">

      <div class="sync" id="sync" data-s="saving"><i></i><span id="synctext">Connecting…</span></div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-act="tab" data-v="today" aria-selected="true">Today</button>

  </div>
</div>

<script>
(function(){

};
PLAN.A[0].bar=true; PLAN.A[1].bar=true;
var EX = {}, SLOTS = {}, ALL = [];
["A","B"].forEach(function(d){PLAN[d].forEach(function(e){

var choice=(function(){try{var v=localStorage.getItem("tdl_choice");return v?JSON.parse(v):{};}catch(e){return {};}})();
function pick(e){

  if(list.length===1)return list[0];
  if(typeof active!=="undefined"&&active){for(var i=0;i<list.length;i++){if(active.sets&&active.sets[list[i].id]&&active.sets[list[i].id].length)return list[i];}}
  var c=choice[list[0].id];
  return (c&&EX[c]&&EX[c].slot===list[0].id)?EX[c]:list[0];
}

/* ---------- storage helpers ---------- */
function lsGet(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

var db=null, dl=null, mode="connecting"; // connecting | cloud | local
/* Each set is its own entry inside its workout, and every write is a merge of
   only the fields that changed, so an old copy of the app can add data but can
   never wipe out sets saved from somewhere else. */
var wDocs={}, lDocs={};                  // workouts (current) + sessions (old format, read-only)
var ops=lsGet("tdl_ops",[]);             // merges not yet confirmed by the server
var localDocs=lsGet("tdl_local",{});     // used only when cloud saving is unavailable
var recent=[];                           // just-confirmed merges, kept briefly to avoid flicker
var cache=[], byId={};
var activeId=null, active=null, view="today", day=null, dayTouched=false, startAnother=false;
var drafts={}, extraRow={}, errors={};
var expanded={}, confirmDel=null, metric="top", exSel=lsGet("tdl_exsel","squat");
var writing=false, syncState="saving", loadedW=false, loadedL=false, adopted=false, closed={};
var renderDeferred=false, wake=null, audio=null;

function clone(o){return JSON.parse(JSON.stringify(o));}
function pad(n){return (n<10?"0":"")+n;}
function todayStr(d){d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parseDate(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function fmtDate(s,withDow){var d=parseDate(s);return (withDow?DOW[d.getDay()]+", ":"")+MON[d.getMonth()]+" "+d.getDate();}
function fmtW(w){return (Math.round(w*10)/10).toString();}
function fmtK(n){return n>=10000?(Math.round(n/100)/10)+"k":Math.round(n).toLocaleString();}
function e1rm(w,r){return r<=1?w:w*(1+r/30);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

function isObj(o){return !!o&&typeof o==="object"&&!Array.isArray(o);}
function merge(a,b){
  if(!isObj(b))return a;
  Object.keys(b).forEach(function(k){var v=b[k];if(v===undefined)return;a[k]=isObj(v)?merge(isObj(a[k])?a[k]:{},v):v;});
  return a;
}
function legacyRaw(s){
  var log={};
  Object.keys(s.sets||{}).forEach(function(e){(s.sets[e]||[]).forEach(function(x){log["L"+e+"_"+x.t]={e:e,w:x.w,r:x.r,t:x.t};});});
  var o={date:s.date,day:s.day,startedAt:s.startedAt,log:log};
  if(s.endedAt)o.endedAt=s.endedAt;
  if(s.manual)o.manual=true;
  if(isObj(s.notes))o.notes=clone(s.notes);
  return o;
}
function rebuild(){
  var raw={}, now=Date.now();
  Object.keys(lDocs).forEach(function(id){raw[id]=legacyRaw(lDocs[id]);});
  var W=mode==="local"?localDocs:wDocs;
  Object.keys(W).forEach(function(id){raw[id]=merge(raw[id]||{},clone(W[id]));});
  recent=recent.filter(function(r){return now-r.at<15000;});
  recent.concat(ops).forEach(function(op){raw[op.id]=merge(raw[op.id]||{},clone(op.data));});
  var out=[]; byId={};
  Object.keys(raw).forEach(function(id){
    var r=raw[id]; if(r.gone||!r.date)return;
    var sets={};
    Object.keys(r.log||{}).forEach(function(k){var x=r.log[k];if(!x||x.x||!EX[x.e])return;(sets[x.e]=sets[x.e]||[]).push({w:x.w,r:x.r,t:x.t,k:k});});
    Object.keys(sets).forEach(function(e){sets[e].sort(function(a,b){return a.t-b.t;});});
    var notes={}; Object.keys(r.notes||{}).forEach(function(e){if(r.notes[e])notes[e]=r.notes[e];});
    var s={id:id,date:r.date,day:r.day||"A",startedAt:r.startedAt||0,endedAt:r.endedAt||0,manual:!!r.manual,notes:notes,sets:sets,backups:isObj(r.backups)?r.backups:{}};
    out.push(s); byId[id]=s;
  });
  out.sort(function(a,b){return b.startedAt-a.startedAt;});
  cache=out;
  active=activeId?(byId[activeId]||null):null;
}
function all(){return cache;}
function setsOf(s,id){return (s&&s.sets&&s.sets[id])||[];}
function mult(id){return (EX[id]&&EX[id].mult)||1;}
function sessionVolume(s){var v=0;Object.keys(s.sets||{}).forEach(function(k){(s.sets[k]||[]).forEach(function(x){v+=x.w*x.r*mult(k);});});return v;}
function sessionSetCount(s){var n=0;Object.keys(s.sets||{}).forEach(function(k){n+=(s.sets[k]||[]).length;});return n;}
function lastSetTime(s){var t=s.startedAt;Object.keys(s.sets||{}).forEach(function(k){(s.sets[k]||[]).forEach(function(x){if(x.t>t)t=x.t;});});return t;}

function lastFor(id,excludeId){
  var list=all();
  for(var i=0;i<list.length;i++){var s=list[i];if(s.id!==excludeId&&setsOf(s,id).length)return s;}
  return null;
}
function bestBefore(id,excludeId,before){
  var bw=0,be=0,br=0,any=false;
  all().forEach(function(s){
    setsOf(s,id).forEach(function(x){
      if(x.t>=before)return;
      any=true; if(x.w>bw)bw=x.w; var e=e1rm(x.w,x.r); if(e>be)be=e; if(x.w===0&&x.r>br)br=x.r;
    });
  });
  return {any:any,w:bw,e:be,r:br};
}
function progression(ex,last){
  if(!last)return null;
  var ls=setsOf(last,ex.id); if(ls.length<ex.sets)return null;
  var w=ls[0].w;
  for(var i=0;i<ex.sets;i++){if(ls[i].r<ex.hi||ls[i].w!==w)return null;}
  if(ex.bw&&w===0)return null;
  return {from:w,to:w+ex.inc};
}

/* ---------- persistence ---------- */
function setSync(s,t){syncState=s;var el=document.getElementById("sync");el.dataset.s=s;document.getElementById("synctext").textContent=t;}
function refreshSync(){
  if(mode==="local"){setSync("local","Saved on this device");return;}
  if(mode==="connecting"||!loadedW){setSync("saving","Connecting…");return;}
  if(writing)setSync("saving","Saving…");
  else if(ops.length)setSync("offline",ops.length+" unsynced · will retry");
  else setSync("ok","All saved");
}
function commit(id,data){
  if(mode==="local"){localDocs[id]=merge(localDocs[id]||{},clone(data));lsSet("tdl_local",localDocs);}
  else{ops.push({id:id,data:clone(data)});lsSet("tdl_ops",ops);flush();}
  rebuild();
}
async function writeOp(op){
  var ref=db.doc("workouts/"+op.id);
  try{await ref.update(op.data);return;}
  catch(e){if(!e||e.code!=="invalid_argument")throw e;}
  var snap=await ref.get();
  if(snap.exists)await ref.update(op.data); else await ref.set(op.data);
}
function flush(){
  refreshSync();
  if(!db||writing||!ops.length)return;
  writing=true; refreshSync();
  (async function(){
    var failed=false;
    while(ops.length&&!failed){
      var op=ops[0];
      try{await writeOp(op);ops.shift();recent.push({id:op.id,data:op.data,at:Date.now()});lsSet("tdl_ops",ops);}
      catch(e){
        if(e&&e.code==="invalid_argument"){ops.shift();lsSet("tdl_ops",ops);continue;}
        failed=true;
        if(e&&e.code==="quota_exceeded")toast("Storage is full. Export your log, then delete old workouts.");
      }
    }
    writing=false; refreshSync();
  })();
}
window.addEventListener("online",flush);
setInterval(function(){if(ops.length)flush();},15000);
document.addEventListener("visibilitychange",function(){if(!document.hidden){flush();if(active)requestWake();}});

function reconcile(){
  var t=todayStr();
  all().slice().forEach(function(s){
    if(s.endedAt||closed[s.id]||s.id===activeId)return;
    if(s.date===t&&sessionSetCount(s)){if(!activeId){activeId=s.id;day=s.day;}return;}
    closed[s.id]=true;
    if(sessionSetCount(s))commit(s.id,{endedAt:lastSetTime(s)});
  });
  rebuild();
}

/* ---------- actions ---------- */
/* ---------- Google Drive backup: every backup ADDS a new file, nothing is ever overwritten ---------- */
var mcp=null, bk={};
var DRIVE="Google Drive", BK_FOLDER="1sHHJOZbVGhiLX_Nz8EvEKhJRSJN5EwQv";
function csvCell(c){c=String(c==null?"":c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}
function hm(t){var d=new Date(t),h=d.getHours(),m=d.getMinutes();return ((h%12)||12)+":"+pad(m)+(h<12?" AM":" PM");}
function workoutCsv(s){
  var rows=[["Date","Day","Exercise","Set","Weight (lb)","Reps","Time","Note","Exercise ID","Timestamp"]], list=[];
  ALL.forEach(function(ex){setsOf(s,ex.id).forEach(function(x,i){list.push([s.date,s.day,ex.name,i+1,x.w,x.r,hm(x.t),i===0?noteOf(s,ex.id):"",ex.id,x.t]);});});
  list.sort(function(a,b){return a[9]-b[9];});
  return rows.concat(list).map(function(r){return r.map(csvCell).join(",");}).join("\n")+"\n";
}
function bkErrText(e){
  var c=e&&e.code;
  if(c==="server_not_connected")return "Google Drive isn't connected. Add it in claude.ai Settings → Connectors, then tap Back up to Drive.";
  if(c==="needs_reauth")return "Google Drive needs to be reconnected. Reconnect it in claude.ai Settings → Connectors, then tap Back up to Drive.";
  if(c==="selection_required")return "Choose which Google Drive account to use when Claude asks, then tap Back up to Drive.";
  if(c==="not_in_manifest")return "Drive backup is turned off for this app. Turn on Google Drive in this page's Permissions menu, then tap Back up to Drive.";
  if(c==="approval_required")return "The backup needs your approval. Tap Back up to Drive and allow it.";
  if(c==="blocked_by_policy")return "Your account's settings don't allow this app to use Google Drive.";
  if(c==="tool_error")return "Google Drive refused the file"+(e.message?": "+e.message:".");
  if(c==="server_unavailable"||c==="upstream_error"||c==="cancelled")return "Drive didn't confirm the backup. Check your Lift Log Backups folder before tapping Back up to Drive again, so you don't get a duplicate.";
  return "The backup didn't finish ("+(c||"unknown error")+"). Tap Back up to Drive to try again.";
}
function fileFrom(res){var p=res&&res.payload;if(typeof p==="string"){try{p=JSON.parse(p);}catch(e){p=null;}}return p&&typeof p==="object"?p:{};}
async function backupWorkout(sid,auto){
  var s=byId[sid];
  if(!s||!sessionSetCount(s)){if(!auto)toast("This workout has no sets to back up.");return;}
  if(!mcp){if(auto)return;bk[sid]={s:"err",msg:"Drive backup only works when the app is open in Claude while you're signed in. Use Export all to CSV as a backup instead."};scheduleRender();return;}
  if(bk[sid]&&bk[sid].s==="busy")return;
  bk[sid]={s:"busy"}; scheduleRender();
  var title="Lift Log "+s.date+" Day "+s.day+" (backed up "+todayStr()+" "+hm(Date.now())+")";
  var input={title:title,parentId:BK_FOLDER,contentMimeType:"text/csv",textContent:workoutCsv(s)};
  var res=null;
  try{res=await mcp.callTool(DRIVE,"create_file",input);}
  catch(e){
    if(e&&e.code==="tool_error"){
      try{delete input.parentId;res=await mcp.callTool(DRIVE,"create_file",input);}
      catch(e2){bk[sid]={s:"err",msg:bkErrText(e2)};scheduleRender();return;}
    }else{bk[sid]={s:"err",msg:bkErrText(e)};scheduleRender();return;}
  }
  var f=fileFrom(res), url=f.viewUrl||(f.id?"https://docs.google.com/spreadsheets/d/"+f.id:"");
  var rec={at:Date.now(),sets:sessionSetCount(s)}; if(url)rec.url=url; if(f.id)rec.id=f.id;
  var b={}; b["b"+Date.now().toString(36)]=rec; commit(sid,{backups:b});
  bk[sid]={s:"ok"}; scheduleRender();
  if(auto)toast("Workout backed up to Google Drive.");
}
function bkLine(s){
  if(!mcp&&!Object.keys(s.backups||{}).length)return "";
  var st=bk[s.id], keys=Object.keys(s.backups||{}).sort(), last=keys.length?s.backups[keys[keys.length-1]]:null;
  var h='<div class="bk">';
  if(st&&st.s==="busy")h+='<span class="bkst">Backing up to Google Drive…</span>';
  else if(st&&st.s==="err")h+='<span class="bkst bad">'+esc(st.msg)+'</span>';
  else if(last){
    var stale=(last.sets||0)!==sessionSetCount(s);
    h+='<span class="bkst ok">✓ Backed up '+fmtDate(todayStr(new Date(last.at)))+', '+hm(last.at)+(stale?' · sets changed since':'')+(last.url?' · <a href="'+esc(last.url)+'" target="_blank" rel="noopener">Open</a>':'')+'</span>';
  }else h+='<span class="bkst">Not backed up to Drive yet</span>';
  if(mcp&&!(st&&st.s==="busy"))h+='<button class="btn" data-act="backup" data-v="'+s.id+'">'+(last?'Back up again':'Back up to Drive')+'</button>';
  return h+'</div>';
}
function newKey(){return "k"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function addSet(sid,e,w,r,t){var log={};log[newKey()]={e:e,w:w,r:r,t:t};commit(sid,{log:log});}
function delSet(sid,k){var log={};log[k]={x:true};commit(sid,{log:log});}
function removeSession(id){if(id===activeId)activeId=null;commit(id,{gone:true});render();}
function currentDay(){
  if(active)return active.day;
  if(day)return day;
  var list=all(); var last=list[0];
  return last?(last.day==="A"?"B":"A"):"A";
}
function prefill(ex){
  var logged=active?setsOf(active,ex.id):[];
  var idx=logged.length;
  var last=lastFor(ex.id,active&&active.id);
  var ls=last?setsOf(last,ex.id):[];
  var prog=progression(ex,last);
  var w="",r="";
  if(logged.length){w=logged[logged.length-1].w;}
  else if(prog){w=prog.to;}
  else if(ls.length){w=ls[Math.min(idx,ls.length-1)].w;}
  else if(ex.bw){w=0;}
  if(prog&&idx<ex.sets){r=ex.lo;}
  else if(ls[idx]&&!prog){r=ls[idx].r;}
  else if(logged.length){r=logged[logged.length-1].r;}
  else r=ex.hi;
  return {w:w,r:r};
}
function draftFor(ex){if(!drafts[ex.id])drafts[ex.id]=prefill(ex);return drafts[ex.id];}

function logSet(id){
  var ex=EX[id], d=draftFor(ex);
  var w=parseFloat(d.w), r=parseInt(d.r,10);
  if(isNaN(w)||w<0||(!ex.bw&&w===0)){errors[id]="Enter the weight for this set.";render();return;}
  if(isNaN(r)||r<1){errors[id]="Enter at least 1 rep.";render();return;}
  delete errors[id];
  var now=Date.now();
  if(!active){
    var nid="s"+now.toString(36), dd=currentDay();
    activeId=nid; startAnother=false;
    commit(nid,{date:todayStr(),day:dd,startedAt:now});
  }
  var best=bestBefore(id,active.id,now);
  addSet(active.id,id,w,r,now);
  delete drafts[id]; delete extraRow[id];
  requestWake();
  if(best.any){
    if(ex.bw&&w===0&&r>best.r&&best.w===0)toast("Rep PR · "+ex.name+": "+r+" reps");
    else if(w>0&&w>best.w)toast("Weight PR · "+ex.name+": "+fmtW(w)+" lb");
    else if(w>0&&e1rm(w,r)>best.e+0.01)toast("Est. 1RM PR · "+ex.name+": "+fmtW(Math.round(e1rm(w,r)))+" lb");
  }
  startRest(ex.rest, ex.name);
  render();
}
function undoSet(id,k){
  if(!active)return;
  delSet(active.id,k);
  delete drafts[id];
  if(active&&!sessionSetCount(active)&&!active.manual){var aid=active.id;activeId=null;commit(aid,{gone:true});stopRest();}
  render();
}
function finish(){
  if(!active)return;
  var aid=active.id;
  closed[aid]=true; activeId=null;
  commit(aid,{endedAt:Date.now()});
  backupWorkout(aid,true);
  drafts={}; extraRow={}; startAnother=false; dayTouched=false; day=null;
  stopRest(); releaseWake(); render(); window.scrollTo(0,0);
}

/* ---------- wake lock + timer ---------- */
async function requestWake(){
  try{if("wakeLock" in navigator&&!wake&&active&&!document.hidden){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",function(){wake=null;});}}catch(e){wake=null;}
}
function releaseWake(){try{if(wake)wake.release();}catch(e){}wake=null;}
var rest={end:0,total:0,iv:null,doneAt:0,label:""};
function ensureAudio(){try{if(!audio){var C=window.AudioContext||window.webkitAudioContext;if(C)audio=new C();}if(audio&&audio.state==="suspended")audio.resume();}catch(e){audio=null;}}
var soundOn=lsGet("tdl_sound",false);
function syncSoundBtn(){var b=document.getElementById("soundbtn");if(b){b.setAttribute("aria-pressed",String(soundOn));b.textContent=soundOn?"Sound on":"Sound off";}}
function flash(){var f=document.getElementById("flash");f.hidden=true;void f.offsetWidth;f.hidden=false;setTimeout(function(){f.hidden=true;},1700);}
function alertDone(){if(soundOn)beep();try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}flash();}
function beep(){
  try{if(!audio)return;[0,0.22,0.44].forEach(function(o){var t=audio.currentTime+o;var g=audio.createGain();var osc=audio.createOscillator();osc.frequency.value=880;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);osc.connect(g);g.connect(audio.destination);osc.start(t);osc.stop(t+0.18);});}catch(e){}
}
function startRest(sec,label){
  ensureAudio();
  rest.total=sec*1000; rest.end=Date.now()+rest.total; rest.doneAt=0; rest.label=label;
  document.getElementById("rest").hidden=false; syncSoundBtn();
  if(!rest.iv)rest.iv=setInterval(tick,250);
  tick();
}
function stopRest(){if(rest.iv)clearInterval(rest.iv);rest.iv=null;document.getElementById("rest").hidden=true;}
function tick(){
  var el=document.getElementById("rest"), left=rest.end-Date.now();
  if(left<=0){
    if(!rest.doneAt){rest.doneAt=Date.now();alertDone();}
    el.classList.add("done");
    document.getElementById("restlbl").textContent="Rest done · next set";
    document.getElementById("resttime").textContent="Go";
    document.getElementById("restbar").style.width="0%";
    if(Date.now()-rest.doneAt>8000)stopRest();
    return;
  }
  el.classList.remove("done");
  var s=Math.ceil(left/1000);
  document.getElementById("restlbl").textContent="Rest · after "+rest.label;
  document.getElementById("resttime").textContent=Math.floor(s/60)+":"+pad(s%60);
  document.getElementById("restbar").style.width=Math.max(0,Math.min(100,left/rest.total*100))+"%";
}

var toastTimer=null;
function toast(msg){
  var slot=document.getElementById("toastslot");
  slot.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){slot.innerHTML="";},3200);
}

/* ---------- rendering ---------- */
function scheduleRender(){
  var a=document.activeElement;
  if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")&&document.getElementById("main").contains(a)){renderDeferred=true;return;}
  render();
}
document.addEventListener("focusout",function(e){
  var t=e.target;
  if(t.tagName==="TEXTAREA"&&t.dataset.note)commitNote(t.dataset.sid+"|"+t.dataset.note);
  if(renderDeferred){setTimeout(function(){var a=document.activeElement;if(!(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"))){renderDeferred=false;render();}},0);}
});

/* notes */
var noteDraft={}, noteTimers={}, noteOpen={}, liftOpen={}, extraLift={}, pdelArm=null, pastForm=false, pastDay="A", pastDate=null;
function setNote(sid,id,v){
  var key=sid+"|"+id; noteDraft[key]=v;
  clearTimeout(noteTimers[key]); noteTimers[key]=setTimeout(function(){commitNote(key);},800);
}
function commitNote(key){
  if(!(key in noteDraft))return;
  clearTimeout(noteTimers[key]); delete noteTimers[key];
  var p=key.split("|"), n={}; n[p[1]]=noteDraft[key].trim()?noteDraft[key]:"";
  delete noteDraft[key];
  commit(p[0],{notes:n});
}
function noteBox(sid,id,v){
  return '<textarea class="note" id="note-'+sid+'-'+id+'" data-sid="'+sid+'" data-note="'+id+'" rows="2" placeholder="Note for next time, e.g. last set felt easy, go up 5 lb" aria-label="Note for '+esc(EX[id].name)+'">'+esc(v)+'</textarea>';
}
function noteOf(s,id){if(!s)return "";var k=s.id+"|"+id;if(k in noteDraft)return noteDraft[k];return (s.notes&&s.notes[id])||"";}

function render(){
  document.querySelectorAll(".tabs button").forEach(function(b){b.setAttribute("aria-selected",String(b.dataset.v===view));});
  var b=document.getElementById("banner");
  b.innerHTML=mode==="local"?'<div class="banner">Your log is saving to this browser only, because cloud saving isn\'t available in this view. Open the app from your Claude account to keep it synced, and use Export in History as a backup.</div>':"";
  var m=document.getElementById("main");
  if(view==="today")m.innerHTML=renderToday();
  else if(view==="progress")m.innerHTML=renderProgress();
  else m.innerHTML=renderHistory();
}

function lastLine(ex,last){
  if(!last)return '<span>First time logging this. Pick a weight you can do for '+ex.hi+' clean reps.</span>';
  var ls=setsOf(last,ex.id), sameW=ls.every(function(x){return x.w===ls[0].w;});
  var txt=sameW?(ls[0].w===0&&ex.bw?"Bodyweight":fmtW(ls[0].w)+" lb")+" × "+ls.map(function(x){return x.r;}).join(", ")
    :ls.map(function(x){return fmtW(x.w)+"×"+x.r;}).join(" · ");
  return '<span>Last · '+fmtDate(last.date)+': <b class="num">'+txt+'</b></span>';
}

function renderToday(){
  var t=todayStr(), list=all();
  var finishedToday=!active&&list[0]&&list[0].date===t&&list[0].endedAt;
  if(finishedToday&&!startAnother)return renderSummary(list[0],true);
  var d=currentDay(), plan=PLAN[d];
  var locked=!!active;
  var last=list.filter(function(s){return !active||s.id!==active.id;})[0];
  var h='<div class="dayhead"><div><div class="eyebrow">'+(active?"In progress · started "+timeStr(active.startedAt):fmtDate(t,true)+(last&&!dayTouched?" · suggested":""))+'</div>'
    +'<div class="daytitle">Day '+d+'<small>'+(d==="A"?"Squat + horizontal":"Single-leg + vertical")+'</small></div></div>'
    +'<div class="daypick" role="group" aria-label="Workout day">'
    +['A','B'].map(function(x){return '<button data-act="day" data-v="'+x+'" aria-pressed="'+(x===d)+'"'+(locked&&x!==d?" disabled":"")+'>'+x+'</button>';}).join("")+'</div></div>';
  if(last)h+='<div class="meta">Last workout: Day '+last.day+' on '+fmtDate(last.date,true)+'.</div>';
  else h+='<div class="meta">Enter a weight, adjust reps, tap ✓. Everything else is recorded for you.</div>';
  h+=GYM;
  h+=renderWarmup(d);
  h+='<div class="list">';
  plan.forEach(function(ex){h+=renderExercise(pick(ex));});
  h+='</div>';
  var n=active?sessionSetCount(active):0;
  h+='<button class="finish" data-act="finish"'+(n?"":" disabled")+'>Finish workout'+(n?' · '+n+' sets':'')+'</button>';
  h+='<p class="foot">Rest guide: 2–3 min on the big lifts, 60–90 sec on accessories. When every set reaches the top of its rep range, the app suggests a heavier weight next time.</p>';
  return h;
}
var GYM='<nav class="gym" aria-label="Gym links"><a href="https://www.purdue.edu/recwell/facility-usage/index.php" target="_blank" rel="noopener"><b>How busy is it?</b><span>Live RecWell facility usage ↗</span></a><a href="https://www.purdue.edu/recwell/index.php" target="_blank" rel="noopener"><b>Purdue RecWell</b><span>Hours, programs and info ↗</span></a></nav>';
var WARM={
  A:{moves:[["World's greatest stretch","3 per side","hips, hamstrings, upper back"],["Bodyweight squat, 2 sec pause at the bottom","10","knees out, chest up"],["Glute bridge","10","squeeze 1 sec at the top"],["Band pull-apart (or arm circles)","15","shoulders and upper back for bench and rows"]],
     first:"squat",second:"bench",secondNote:"before your first working set of bench"},
  B:{moves:[["World's greatest stretch","3 per side","hips, hamstrings, upper back"],["Reverse lunge","5 per leg","slow, control the bottom"],["Scap pull-up (or band pull-apart)","8","shoulder blades down and back, arms straight"],["Wall slide (or band dislocate)","10","overhead range for pressing"]],
     first:"bss_bb",second:"dbpress",secondNote:"before your first working set of shoulder press"}
};
var warmOpen=null;
function r5(x){return Math.max(5,Math.round(x/5)*5);}
function rampFor(ex,pcts){
  var d=draftFor(ex), w=parseFloat(d.w), out=[];
  var bar=!!ex.bar;
  if(isNaN(w)||w<=0){
    if(bar)out.push("Empty bar × 10");
    pcts.forEach(function(p){out.push(Math.round(p[0]*100)+"% × "+p[1]);});
    return {list:out,known:false};
  }
  var lastW=0;
  if(bar&&w>45){out.push("45 lb × 10");lastW=45;}
  else if(!bar&&ex.id==="splitsquat"){out.push("Bodyweight × 8/leg");}
  pcts.forEach(function(p){var x=r5(w*p[0]);if(x>lastW&&x<w){out.push(x+" lb × "+p[1]);lastW=x;}});
  return {list:out,known:true,w:w};
}
function renderWarmup(d){
  var W=WARM[d], started=active&&sessionSetCount(active)>0;
  var open=warmOpen===null?!started:warmOpen;
  var f=pick(EX[W.first]), s=pick(EX[W.second]);
  var r1=rampFor(f,f.id==="squat"?[[0.5,5],[0.7,3],[0.85,1]]:[[0.5,5],[0.75,3]]);
  var r2=rampFor(s,[[0.5,5],[0.75,2]]);
  var h='<details class="card wu" id="warmup"'+(open?" open":"")+'><summary><span><span class="eyebrow">About 10 min · before set 1</span><span class="wut">Warm-up</span></span><span class="wuc" aria-hidden="true">'+(open?"Hide":"Show")+'</span></summary>';
  h+='<ol class="wus">';
  h+='<li><b>General · 3 min</b><p>Easy bike, rower or incline walk. Breathing up a little, able to talk. The goal is a warmer body, not fatigue.</p></li>';
  h+='<li><b>Dynamic mobility · 3 min</b><p>One round, no rest between moves.</p><ul class="wum">'+W.moves.map(function(m){return '<li><span>'+esc(m[0])+'<small>'+esc(m[2])+'</small></span><em class="num">'+esc(m[1])+'</em></li>';}).join("")+'</ul></li>';
  h+='<li><b>Ramp-up sets · '+esc(f.name)+' · 3–4 min</b><p>'+(r1.known?'Building to your first working set of '+fmtW(r1.w)+' lb. Rest only 30–60 sec between these.':'Percentages of your first working set. Rest only 30–60 sec between these.')+'</p><div class="ramp">'+r1.list.map(function(x){return '<span class="num">'+esc(x)+'</span>';}).join("")+'</div></li>';
  h+='<li><b>Primer · '+esc(s.name)+'</b><p>Two quick sets '+esc(W.secondNote)+'. Later exercises need no separate warm-up.</p><div class="ramp">'+r2.list.map(function(x){return '<span class="num">'+esc(x)+'</span>';}).join("")+'</div></li>';
  h+='</ol><p class="wun">Skip long static stretching before lifting. Holds over about 60 sec per muscle can briefly reduce strength; save them for after your workout. Ramp-up sets don\'t count as working sets and aren\'t logged.</p></details>';
  return h;
}
function timeStr(ms){var d=new Date(ms),h=d.getHours(),m=d.getMinutes();return ((h%12)||12)+":"+pad(m)+(h<12?" am":" pm");}

function renderExercise(ex){
  var logged=active?setsOf(active,ex.id):[];
  var last=lastFor(ex.id,active&&active.id);
  var prog=progression(ex,last);
  var target=logged.length<ex.sets?ex.sets:logged.length+(extraRow[ex.id]?1:0);
  var done=logged.length>=ex.sets;
  var h='<section class="ex'+(done?" done":"")+'" id="ex-'+ex.id+'"><div class="exhead"><div><h3>'+esc(ex.name)+'</h3>'+(ex.alt?'<div class="alt">'+esc(ex.alt)+'</div>':"")+'</div>'
    +'<div class="target num">'+ex.sets+' × '+ex.lo+'–'+ex.hi+(ex.mult?' + '+ex.lo+'–'+ex.hi:'')+'<span>'+restLabel(ex.rest)+' rest</span></div></div>';
  var opts=SLOTS[ex.slot]||[ex];
  if(opts.length>1){
    var lockV=logged.length>0;
    h+='<div class="vseg" role="group" aria-label="Variation">'+opts.map(function(o){return '<button data-act="variant" data-slot="'+o.slot+'" data-v="'+o.id+'" aria-pressed="'+(o.id===ex.id)+'"'+(lockV&&o.id!==ex.id?' disabled title="Undo your logged sets to switch"':'')+'>'+esc(o.tag)+'</button>';}).join("")+'</div>';
  }
  h+='<div class="last">'+lastLine(ex,last);
  if(prog&&!logged.length)h+='<span class="chip up">↑ Go to '+fmtW(prog.to)+' lb</span>';
  if(done)h+='<span class="chip ok">✓ Done</span>';
  h+='</div>';
  var ln=noteOf(last,ex.id);
  if(ln)h+='<div class="lastnote"><span class="eyebrow">Your note · '+fmtDate(last.date)+'</span><p>'+esc(ln)+'</p></div>';
  h+='<div class="sets">';
  var t0=active?active.startedAt:0;
  logged.forEach(function(x,i){
    var best=bestBefore(ex.id,active.id,x.t), pr="";
    if(best.any){
      if(x.w>0&&x.w>best.w)pr='<span class="chip pr">Weight PR</span>';
      else if(x.w>0&&e1rm(x.w,x.r)>best.e+0.01)pr='<span class="chip pr">1RM PR</span>';
      else if(ex.bw&&x.w===0&&best.w===0&&x.r>best.r)pr='<span class="chip pr">Rep PR</span>';
    }
    h+='<div class="row logged"><div class="sn">'+(i+1)+'</div><div class="valwrap"><span class="val num">'+(x.w===0&&ex.bw?"BW":fmtW(x.w)+' <small>lb</small>')+' × '+x.r+'</span>'+pr+'</div>'
      +'<button class="undo" data-act="undo" data-ex="'+ex.id+'" data-k="'+x.k+'" aria-label="Remove set '+(i+1)+'">Undo</button></div>';
  });
  if(logged.length<target){
    var d=draftFor(ex);
    h+='<div class="row"><div class="sn">'+(logged.length+1)+'</div><div class="inputs">'
      +field(ex.id,"w",d.w,"lb")+field(ex.id,"r",d.r,"reps")+'</div>'
      +'<button class="log" data-act="log" data-ex="'+ex.id+'" aria-label="Log set '+(logged.length+1)+' of '+esc(ex.name)+'">✓</button></div>';
    for(var k=logged.length+1;k<target;k++){
      h+='<div class="row planned"><div class="sn">'+(k+1)+'</div><div class="val num">'+(d.w!==""?(d.w==0&&ex.bw?"BW":fmtW(+d.w)+" lb")+" × ":"")+ex.lo+'–'+ex.hi+'</div><div></div></div>';
    }
  }
  h+='</div>';
  if(errors[ex.id])h+='<div class="err">'+esc(errors[ex.id])+'</div>';
  if(logged.length>=target)h+='<button class="addset" data-act="addset" data-ex="'+ex.id+'">+ Add a set</button>';
  if(logged.length){
    var nv=noteOf(active,ex.id);
    if(nv||noteOpen[ex.id])h+=noteBox(active.id,ex.id,nv);
    else h+='<button class="addnote" data-act="addnote" data-ex="'+ex.id+'">+ Note for next time</button>';
  }
  return h+'</section>';
}
function restLabel(s){return s%60===0?(s/60)+" min":Math.floor(s/60)?Math.floor(s/60)+":"+pad(s%60):s+" sec";}
function field(id,f,v,unit){
  return '<div class="field"><button data-act="step" data-ex="'+id+'" data-f="'+f+'" data-d="-1" aria-label="Decrease '+unit+'">−</button>'
    +'<label><input id="in-'+f+'-'+id+'" data-ex="'+id+'" data-f="'+f+'" inputmode="'+(f==="w"?"decimal":"numeric")+'" value="'+esc(v)+'" placeholder="'+(f==="w"?"0":"0")+'" aria-label="'+unit+'" autocomplete="off"><span class="u">'+unit+'</span></label>'
    +'<button data-act="step" data-ex="'+id+'" data-f="'+f+'" data-d="1" aria-label="Increase '+unit+'">+</button></div>';
}

function prsIn(s){
  var out=[];
  Object.keys(s.sets||{}).forEach(function(id){
    var ex=EX[id]; if(!ex)return;
    var topW=-1,topE=-1,topR=-1,firstT=Infinity;
    setsOf(s,id).forEach(function(x){if(x.w>topW)topW=x.w;var e=e1rm(x.w,x.r);if(e>topE)topE=e;if(x.w===0&&x.r>topR)topR=x.r;if(x.t<firstT)firstT=x.t;});
    var best=bestBefore(id,s.id,firstT);
    if(!best.any)return;
    if(topW>0&&topW>best.w)out.push(ex.name+": "+fmtW(topW)+" lb (weight PR)");
    else if(topW>0&&topE>best.e+0.01)out.push(ex.name+": est. 1RM "+Math.round(topE)+" lb");
    else if(ex.bw&&topW===0&&best.w===0&&topR>best.r)out.push(ex.name+": "+topR+" reps (rep PR)");
  });
  return out;
}
function renderSummary(s,isToday){
  var mins=Math.max(1,Math.round(((s.endedAt||lastSetTime(s))-s.startedAt)/60000));
  var prs=prsIn(s), next=s.day==="A"?"B":"A";
  var h='<div class="card"><div class="eyebrow">'+(isToday?"Done for today":"Workout")+' · '+fmtDate(s.date,true)+'</div><h2>Day '+s.day+' complete</h2>'
    +'<div class="stats"><div class="stat"><b class="num">'+mins+'</b><span>Minutes</span></div><div class="stat"><b class="num">'+sessionSetCount(s)+'</b><span>Sets</span></div><div class="stat"><b class="num">'+fmtK(sessionVolume(s))+'</b><span>Volume lb</span></div><div class="stat"><b class="num">'+prs.length+'</b><span>PRs</span></div></div>';
  if(prs.length)h+='<ul class="prlist">'+prs.map(function(p){return '<li><span class="chip pr">PR</span> '+esc(p)+'</li>';}).join("")+'</ul>';
  h+=bkLine(s);
  h+='<p class="meta">Next up: Day '+next+'. Aim for 2–3 days of rest before it.</p>'
    +'<div class="btnrow"><button class="btn" data-act="tab" data-v="progress">See progress</button><button class="btn" data-act="another">Log another workout</button></div></div>';
  return h;
}

/* progress */
function seriesFor(id){
  var ex=EX[id], out=[];
  all().slice().reverse().forEach(function(s){
    var ls=setsOf(s,id); if(!ls.length)return;
    var top=0,topR=0,e=0,v=0,reps=0;
    ls.forEach(function(x){if(x.w>top)top=x.w;if(x.r>topR)topR=x.r;var q=e1rm(x.w,x.r);if(q>e)e=q;v+=x.w*x.r*(ex.mult||1);reps+=x.r;});
    out.push({date:s.date,top:top,e:e,vol:v,reps:reps,topR:topR});
  });
  var allBw=ex.bw&&out.every(function(p){return p.top===0;});
  return {pts:out,allBw:allBw};
}
function renderProgress(){
  var list=all();
  var h='<select class="sel" id="exsel" aria-label="Exercise">';
  ["A","B"].forEach(function(d){h+='<optgroup label="Day '+d+'">'+ALL.filter(function(e){return e.day===d;}).map(function(e){return '<option value="'+e.id+'"'+(e.id===exSel?" selected":"")+'>'+esc(e.name)+'</option>';}).join("")+'</optgroup>';});
  h+='</select>';
  var ex=EX[exSel]||EX.squat, S=seriesFor(ex.id), pts=S.pts;
  var bestW=0,bestE=0,bestR=0; pts.forEach(function(p){if(p.top>bestW)bestW=p.top;if(p.e>bestE)bestE=p.e;if(p.topR>bestR)bestR=p.topR;});
  h+='<div class="stats">'
    +(S.allBw?'<div class="stat"><b class="num">'+(pts.length?bestR:"–")+'</b><span>Best reps</span></div>'
      :'<div class="stat"><b class="num">'+(pts.length?fmtW(bestW):"–")+'</b><span>Best lb</span></div><div class="stat"><b class="num">'+(pts.length?Math.round(bestE):"–")+'</b><span>Est. 1RM lb</span></div>')
    +'<div class="stat"><b class="num">'+pts.length+'</b><span>Sessions</span></div></div>';
  var metrics=S.allBw?[["reps","Total reps"],["topR","Best set"]]:[["top","Top weight"],["e","Est. 1RM"],["vol","Volume"]];
  if(!metrics.some(function(m){return m[0]===metric;}))metric=metrics[0][0];
  h+='<div class="seg" role="group" aria-label="Chart metric">'+metrics.map(function(m){return '<button data-act="metric" data-v="'+m[0]+'" aria-pressed="'+(m[0]===metric)+'">'+m[1]+'</button>';}).join("")+'</div>';
  h+='<div class="chart">'+(pts.length?chart(pts.map(function(p){return {x:p.date,y:p[metric]};}),metric==="reps"||metric==="topR"?"reps":"lb"):'<div class="empty">No sets logged for '+esc(ex.name)+' yet. Log it on Day '+ex.day+' and your progress will chart here.</div>')+'</div>';

  /* consistency */
  var now=new Date(); var mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7));
  var weeks=[]; for(var i=11;i>=0;i--){var st=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()-7*i);weeks.push({start:st,n:0});}
  list.forEach(function(s){if(!sessionSetCount(s))return;var d=parseDate(s.date);for(var k=0;k<weeks.length;k++){var en=new Date(weeks[k].start.getFullYear(),weeks[k].start.getMonth(),weeks[k].start.getDate()+7);if(d>=weeks[k].start&&d<en){weeks[k].n++;break;}}});
  var hit=weeks.filter(function(w){return w.n>=2;}).length, streak=0;
  for(var j=weeks.length-2;j>=0;j--){if(weeks[j].n>=2)streak++;else break;}
  if(weeks[11].n>=2)streak++;
  var thisWeek=weeks[11].n;
  h+='<h2 class="h2">Consistency</h2><div class="stats"><div class="stat"><b class="num">'+thisWeek+'/2</b><span>This week</span></div><div class="stat"><b class="num">'+streak+'</b><span>Week streak</span></div><div class="stat"><b class="num">'+list.filter(function(s){return sessionSetCount(s);}).length+'</b><span>Workouts</span></div></div>';
  h+='<div class="weeks" aria-label="Workouts per week, last 12 weeks">'+weeks.map(function(w){return '<div class="wk" title="Week of '+MON[w.start.getMonth()]+' '+w.start.getDate()+': '+w.n+' workouts"><i class="'+(w.n>=2?"over":w.n?"on":"")+'"></i><i class="'+(w.n>=2?"over":"")+'"></i><span>'+(w.start.getMonth()+1)+'/'+w.start.getDate()+'</span></div>';}).join("")+'</div>';
  h+='<p class="foot">Each column is a week (Mon–Sun). Green means both workouts done. '+hit+' of the last 12 weeks hit 2 workouts.</p>';
  return h;
}
function niceTicks(min,max){
  if(min===max){min=min-5;max=max+5;}
  var span=max-min, step=Math.pow(10,Math.floor(Math.log10(span/3))), err=span/3/step;
  if(err>=5)step*=5;else if(err>=2)step*=2;
  var lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, t=[];
  for(var v=lo;v<=hi+1e-9;v+=step)t.push(Math.round(v*100)/100);
  return {lo:lo,hi:hi,t:t};
}
function chart(pts,unit){
  var W=600,H=240,L=46,R=16,T=16,B=30;
  var ys=pts.map(function(p){return p.y;}), mn=Math.min.apply(null,ys), mx=Math.max.apply(null,ys);
  var tk=niceTicks(Math.max(0,mn-(mx-mn)*0.15),mx+(mx-mn)*0.1);
  function X(i){return pts.length===1?L+(W-L-R)/2:L+i*(W-L-R)/(pts.length-1);}
  function Y(v){return T+(H-T-B)*(1-(v-tk.lo)/(tk.hi-tk.lo));}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Chart of '+unit+' per session">';
  tk.t.forEach(function(v){var y=Y(v);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="12" fill="var(--muted)" font-family="Barlow, sans-serif">'+fmtK(v)+'</text>';});
  var path=pts.map(function(p,i){return (i?"L":"M")+X(i).toFixed(1)+" "+Y(p.y).toFixed(1);}).join(" ");
  if(pts.length>1){
    var area=path+" L"+X(pts.length-1).toFixed(1)+" "+(H-B)+" L"+X(0).toFixed(1)+" "+(H-B)+" Z";
    s+='<path d="'+area+'" fill="var(--accent)" fill-opacity="0.12" stroke="none"/>';
    s+='<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  pts.forEach(function(p,i){var last=i===pts.length-1;s+='<circle cx="'+X(i)+'" cy="'+Y(p.y)+'" r="'+(last?5.5:3)+'" fill="'+(last?"var(--accent)":"var(--surface)")+'" stroke="var(--accent)" stroke-width="2"><title>'+fmtDate(p.x)+': '+fmtW(Math.round(p.y*10)/10)+' '+unit+'</title></circle>';});
  var lp=pts[pts.length-1];
  s+='<text x="'+Math.min(W-R,X(pts.length-1))+'" y="'+Math.max(12,Y(lp.y)-12)+'" text-anchor="end" font-size="14" font-weight="700" fill="var(--ink)" font-family="Barlow Condensed, sans-serif">'+fmtK(Math.round(lp.y))+' '+unit+'</text>';
  s+='<text x="'+X(0)+'" y="'+(H-8)+'" text-anchor="'+(pts.length===1?"middle":"start")+'" font-size="12" fill="var(--muted)" font-family="Barlow, sans-serif">'+fmtDate(pts[0].x)+'</text>';
  if(pts.length>1)s+='<text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end" font-size="12" fill="var(--muted)" font-family="Barlow, sans-serif">'+fmtDate(lp.x)+'</text>';
  return s+'</svg>';
}

/* history */
function renderHistory(){
  var list=all().filter(function(s){return sessionSetCount(s)||s.manual;});
  var h='<div class="btnrow"><button class="btn primary" data-act="export">Export all to CSV</button><button class="btn" data-act="pastnew">+ Add a past workout</button><button class="btn" data-act="exportjson">Export JSON</button><button class="btn" data-act="import">Import</button></div>';
  if(pastForm){
    var t=todayStr();
    h+='<div class="card pform"><div class="eyebrow">Add a workout you didn\'t log</div><label for="pdate">Date<input type="date" id="pdate" max="'+t+'" value="'+esc(pastDate||t)+'"></label>'
      +'<div class="daypick" role="group" aria-label="Workout day">'+['A','B'].map(function(x){return '<button data-act="pastday" data-v="'+x+'" aria-pressed="'+(x===pastDay)+'">'+x+'</button>';}).join('')+'</div>'
      +'<div class="btnrow" style="margin:0"><button class="btn primary" data-act="pastcreate">Create workout</button><button class="btn" data-act="pastcancel">Cancel</button></div></div>';
  }
  if(!list.length)return h+'<div class="empty">No workouts yet. Your sessions will be listed here after you log your first set.</div>';
  h+='<div class="hist">';
  list.forEach(function(s){
    var open=!!expanded[s.id], live=active&&active.id===s.id;
    var mins=Math.max(1,Math.round(((s.endedAt||lastSetTime(s))-s.startedAt)/60000));
    h+='<div class="hitem"><button class="hsum" data-act="expand" data-v="'+s.id+'" aria-expanded="'+open+'"><span class="hday">'+s.day+'</span><span><span class="hdate">'+fmtDate(s.date,true)+'</span><br><span class="hsub">'+(live?"In progress · ":s.manual?"Added later · ":mins+" min · ")+sessionSetCount(s)+' sets</span></span><span class="hvol num">'+fmtK(sessionVolume(s))+'<span>lb volume</span></span></button>';
    if(open){
      h+='<div class="hdetail"><div class="hlifts">';
      var ex2=extraLift[s.id]||{};
      ALL.forEach(function(ex){var ls=setsOf(s,ex.id);if(!ls.length&&!ex2[ex.id])return;
        var key=s.id+":"+ex.id, lo=!!liftOpen[key], note=noteOf(s,ex.id);
        var topW=ls.length?Math.max.apply(null,ls.map(function(x){return x.w;})):0;
        var top=!ls.length?"no sets yet":(ex.bw&&topW===0)?"best "+Math.max.apply(null,ls.map(function(x){return x.r;}))+" reps":"top "+fmtW(topW)+" lb";
        h+='<div class="hlift'+(lo?" open":"")+'"><button class="hlhead" data-act="lift" data-v="'+key+'" aria-expanded="'+lo+'"><span class="hlname">'+esc(ex.name)+'</span><span class="hlsum num">'+ls.length+' sets · '+top+(note?' · <span class="hlnote">note</span>':'')+'</span><span class="hlcar" aria-hidden="true">'+(lo?"−":"+")+'</span></button>';
        if(lo){
          h+='<div class="hsets">';
          ls.forEach(function(x,i){
            var best=bestBefore(ex.id,s.id,x.t), pr="";
            if(best.any){
              if(x.w>0&&x.w>best.w)pr='<span class="chip pr">PR</span>';
              else if(x.w>0&&e1rm(x.w,x.r)>best.e+0.01)pr='<span class="chip pr">1RM PR</span>';
              else if(ex.bw&&x.w===0&&best.w===0&&x.r>best.r)pr='<span class="chip pr">Rep PR</span>';
            }
            h+='<div class="hset"><span class="hsn">'+(i+1)+'</span><span class="hval num">'+(x.w===0&&ex.bw?"BW":fmtW(x.w)+'<small>lb</small>')+' × '+x.r+'</span>'+pr+'<button class="x'+(pdelArm===key+":"+x.k?" arm":"")+'" data-act="pdel" data-sid="'+s.id+'" data-ex="'+ex.id+'" data-k="'+x.k+'" aria-label="Remove set '+(i+1)+'">'+(pdelArm===key+":"+x.k?"Remove?":"×")+'</button></div>';
          });
          var lx=ls[ls.length-1];
          h+='</div><div class="padd"><input id="pw-'+key+'" inputmode="decimal" value="'+(lx?fmtW(lx.w):"")+'" placeholder="lb" aria-label="Weight in pounds"><span>lb ×</span><input id="pr-'+key+'" inputmode="numeric" value="'+(lx?lx.r:"")+'" placeholder="reps" aria-label="Reps"><button class="btn primary" data-act="padd" data-sid="'+s.id+'" data-ex="'+ex.id+'">Add set</button></div>'+noteBox(s.id,ex.id,note);
        }
        h+='</div>';
      });
      h+='</div>';
      if(!live)h+=bkLine(s);
      var miss=ALL.filter(function(e){return !setsOf(s,e.id).length&&!ex2[e.id];}).sort(function(a,b){return (a.day===s.day?0:1)-(b.day===s.day?0:1);});
      if(miss.length)h+='<select class="addex" data-sid="'+s.id+'" aria-label="Add an exercise to this workout"><option value="">+ Add an exercise to this workout</option>'+miss.map(function(e){return '<option value="'+e.id+'">'+esc(e.name)+' (Day '+e.day+')</option>';}).join('')+'</select>';
      if(confirmDel===s.id)h+='<div class="btnrow"><span class="meta" style="margin:0;align-self:center">Delete this workout for good?</span><button class="btn danger" data-act="delyes" data-v="'+s.id+'">Delete</button><button class="btn" data-act="delno">Keep</button></div>';
      else if(!live)h+='<div class="btnrow"><button class="btn danger" data-act="del" data-v="'+s.id+'">Delete workout</button></div>';
      h+='</div>';
    }
    h+='</div>';
  });
  return h+'</div>';
}
async function exportCsv(){
  var rows=[["date","day","exercise","set","weight_lb","reps","est_1rm_lb","volume_lb","time","note"]];
  all().slice().reverse().forEach(function(s){
    ALL.forEach(function(ex){setsOf(s,ex.id).forEach(function(x,i){
      rows.push([s.date,s.day,ex.name,i+1,x.w,x.r,Math.round(e1rm(x.w,x.r)),x.w*x.r*(ex.mult||1),new Date(x.t).toLocaleTimeString(),i===0?noteOf(s,ex.id):""]);});});
  });
  var csv=rows.map(function(r){return r.map(function(c){c=String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(",");}).join("\n");
  if(rows.length===1){toast("Nothing to export yet.");return;}
  if(!dl){toast("Export isn't available in this view. Open the app in Claude to export.");return;}
  try{await dl.save({filename:"workout-log-"+todayStr()+".csv",data:csv});}
  catch(e){if(e&&e.code==="declined")return;if(e&&e.code==="rate_limited"){toast("A save prompt is already open.");return;}toast("Export couldn't start. Try again in a moment.");}
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]"); if(!b)return;
  var a=b.dataset.act, id=b.dataset.ex, v=b.dataset.v;
  if(a==="tab"){view=v;render();window.scrollTo(0,0);return;}
  if(a==="day"){if(active)return;day=v;dayTouched=true;drafts={};render();return;}
  if(a==="log"){logSet(id);return;}
  if(a==="undo"){undoSet(id,b.dataset.k);return;}
  if(a==="step"){
    var ex=EX[id], d=draftFor(ex), f=b.dataset.f, dir=+b.dataset.d;
    var cur=parseFloat(d[f]); if(isNaN(cur))cur=0;
    var nv=f==="w"?Math.max(0,cur+dir*5):Math.max(1,cur+dir);
    d[f]=nv; var inp=document.getElementById("in-"+f+"-"+id); if(inp)inp.value=f==="w"?fmtW(nv):nv;
    delete errors[id]; return;
  }
  if(a==="addnote"){noteOpen[id]=true;render();var ta=active&&document.getElementById("note-"+active.id+"-"+id);if(ta)ta.focus();return;}
  if(a==="sound"){soundOn=!soundOn;lsSet("tdl_sound",soundOn);syncSoundBtn();if(soundOn){ensureAudio();beep();}return;}
  if(a==="pastnew"){pastForm=!pastForm;pastDate=null;render();return;}
  if(a==="pastcancel"){pastForm=false;render();return;}
  if(a==="pastday"){var pd=document.getElementById("pdate");if(pd)pastDate=pd.value;pastDay=v;render();return;}
  if(a==="pastcreate"){
    var pv=(document.getElementById("pdate")||{}).value||"";
    if(!/^\d{4}-\d{2}-\d{2}$/.test(pv)||pv>todayStr()){toast("Pick a date that isn't in the future.");return;}
    var dd=parseDate(pv), st=new Date(dd.getFullYear(),dd.getMonth(),dd.getDate(),12).getTime();
    var nd={id:"s"+Date.now().toString(36)};
    closed[nd.id]=true; commit(nd.id,{date:pv,day:pastDay,startedAt:st,endedAt:st,manual:true}); expanded[nd.id]=true; pastForm=false; render(); toast("Workout added. Now add its exercises."); return;
  }
  if(a==="padd"){
    var key=b.dataset.sid+":"+id, wi=document.getElementById("pw-"+key), ri=document.getElementById("pr-"+key);
    var pw=parseFloat(wi&&wi.value), pr2=parseInt(ri&&ri.value,10), exo=EX[id];
    if(isNaN(pw)||pw<0||(!exo.bw&&pw===0)){toast("Enter the weight for this set.");return;}
    if(isNaN(pr2)||pr2<1){toast("Enter at least 1 rep.");return;}
    var ss=byId[b.dataset.sid]; if(!ss)return;
    var t=Math.max(lastSetTime(ss),ss.startedAt)+1000;
    addSet(ss.id,id,pw,pr2,t); if(ss.endedAt&&t>ss.endedAt)commit(ss.id,{endedAt:t});
    render();
    return;
  }
  if(a==="pdel"){
    var k2=b.dataset.sid+":"+id+":"+b.dataset.k;
    if(pdelArm!==k2){pdelArm=k2;render();return;}
    pdelArm=null;
    delSet(b.dataset.sid,b.dataset.k);
    var ss2=byId[b.dataset.sid]; if(ss2&&!setsOf(ss2,id).length){extraLift[ss2.id]=extraLift[ss2.id]||{};extraLift[ss2.id][id]=true;}
    render();
    if(active&&active.id===b.dataset.sid)delete drafts[id];
    return;
  }
  if(a==="variant"){
    var cur=pick(EX[b.dataset.slot]);
    if(active&&setsOf(active,cur.id).length)return;
    choice[b.dataset.slot]=v; lsSet("tdl_choice",choice);
    (SLOTS[b.dataset.slot]||[]).forEach(function(o){delete drafts[o.id];delete errors[o.id];});
    render(); return;
  }
  if(a==="lift"){liftOpen[v]=!liftOpen[v];render();return;}
  if(a==="addset"){extraRow[id]=true;delete drafts[id];render();return;}
  if(a==="finish"){finish();return;}
  if(a==="another"){startAnother=true;day=null;dayTouched=false;drafts={};render();return;}
  if(a==="rest-add"){rest.end+= (+v)*1000; rest.total=Math.max(rest.total,rest.end-Date.now()); rest.doneAt=0; tick(); return;}
  if(a==="rest-skip"){stopRest();return;}
  if(a==="metric"){metric=v;render();return;}
  if(a==="expand"){expanded[v]=!expanded[v];if(confirmDel===v&&!expanded[v])confirmDel=null;render();return;}
  if(a==="del"){confirmDel=v;render();return;}
  if(a==="delno"){confirmDel=null;render();return;}
  if(a==="delyes"){confirmDel=null;delete expanded[v];removeSession(v);toast("Workout deleted.");return;}
  if(a==="export"){exportCsv();return;}
  if(a==="exportjson"){exportJson();return;}
  if(a==="import"){document.getElementById("impfile").click();return;}
  if(a==="backup"){backupWorkout(v,false);return;}
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.tagName==="TEXTAREA"&&t.dataset.note){setNote(t.dataset.sid,t.dataset.note,t.value);return;}

},true);

/* ---------- import / export (added in Homebase) ----------
   Import takes the JSON from "Export JSON" (or the lift-log-export.json made from the original app)
   or the CSV from "Export all to CSV". Importing the same file twice changes nothing. */
function exportJson(){
  var W=mode==="local"?localDocs:wDocs, list=Object.keys(W).map(function(id){return {id:id,data:W[id]};});
  if(!list.length){toast("Nothing to export yet.");return;}
  if(!dl){toast("Export isn't available here.");return;}
  dl.save({filename:"lift-log-"+todayStr()+".json",data:JSON.stringify({format:"lift-log-export",version:1,exportedAt:todayStr(),workouts:list},null,1)});
}
function parseCsv(t){var rows=[],row=[],f="",q=false;for(var i=0;i<t.length;i++){var c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}else if(c==='"')q=true;else if(c===','){row.push(f);f="";}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f="";}else f+=c;}if(f!==""||row.length){row.push(f);rows.push(row);}return rows.filter(function(r){return r.some(function(x){return String(x).trim();});});}
function clockMs(s){var m=String(s||"").match(/(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([ap])?/i);if(!m)return null;var h=+m[1];if(m[4]){var p=m[4].toLowerCase();if(p==="p"&&h<12)h+=12;if(p==="a"&&h===12)h=0;}return ((h*60+(+m[2]))*60+(+(m[3]||0)))*1000;}
function importData(text){
  var n=0,sets=0;
  if(/^\s*[\[{]/.test(text)){
    var j=JSON.parse(text), list=Array.isArray(j)?j:(j.workouts||[]), sess=Array.isArray(j.sessions)?j.sessions:[];
    list.forEach(function(w){var id=w&&w.id,d=w&&(w.data||w);if(!id||!isObj(d)||!d.date)return;d=clone(d);delete d.id;commit(id,d);n++;
      Object.keys(d.log||{}).forEach(function(k){if(d.log[k]&&!d.log[k].x)sets++;});});
    sess.forEach(function(s){var d=s&&(s.data||s),id=s&&(s.id||d.id);if(!id||!isObj(d)||!d.date)return;var L=legacyRaw(d);commit(id,L);n++;sets+=Object.keys(L.log).length;});
  } else {
    var rows=parseCsv(text), head=(rows.shift()||[]).map(function(h){return String(h).trim().toLowerCase();}), ix=function(k){return head.indexOf(k);};
    var iD=ix("date"),iDay=ix("day"),iE=ix("exercise"),iW=ix("weight_lb"),iR=ix("reps"),iT=ix("time"),iN=ix("note");
    if(iD<0||iE<0||iW<0||iR<0)throw new Error("this CSV doesn't have the Lift Log columns (date, day, exercise, weight_lb, reps)");
    var byName={};ALL.forEach(function(e){byName[e.name.toLowerCase()]=e.id;});
    var docs={};
    rows.forEach(function(r,k){
      var date=String(r[iD]||"").trim(),exId=byName[String(r[iE]||"").trim().toLowerCase()];
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!exId)return;
      var w=parseFloat(r[iW]),reps=parseInt(r[iR],10);if(isNaN(w)||isNaN(reps))return;
      var dv=iDay>=0?String(r[iDay]||"").trim():"", day=/^[AB]$/.test(dv)?dv:EX[exId].day, id="c"+date.replace(/-/g,"")+day;
      var cm=clockMs(iT>=0?r[iT]:""), t=parseDate(date).getTime()+(cm==null?12*3600000:cm)+(k%1000);
      var d=docs[id]||(docs[id]={date:date,day:day,startedAt:t,endedAt:t,log:{},notes:{}});
      d.log["c"+exId+"_"+t]={e:exId,w:w,r:reps,t:t};
      if(t<d.startedAt)d.startedAt=t; if(t>d.endedAt)d.endedAt=t;
      if(iN>=0&&String(r[iN]||"").trim())d.notes[exId]=String(r[iN]).trim();
      sets++;
    });
    Object.keys(docs).forEach(function(id){commit(id,docs[id]);n++;});
  }
  rebuild(); reconcile(); render();
  toast(n?("Imported "+n+" workout"+(n===1?"":"s")+" · "+sets+" sets"):"Nothing to import in that file.");
}
document.getElementById("impfile").addEventListener("change",function(e){
  var f=e.target.files[0]; e.target.value=""; if(!f)return;
  f.text().then(function(t){try{importData(t);}catch(err){toast("Couldn't import: "+(err&&err.message||err));}});
});

/* ---------- boot ---------- */
rebuild();
render();
function startLocal(){
  if(mode==="local")return;
  mode="local";
  ops.forEach(function(op){localDocs[op.id]=merge(localDocs[op.id]||{},clone(op.data));});
  ops=[]; lsSet("tdl_ops",ops); lsSet("tdl_local",localDocs);
  rebuild(); reconcile(); drafts={}; refreshSync(); render();
}
function adopt(){
  Object.keys(lDocs).forEach(function(id){
    var L=legacyRaw(lDocs[id]), W=wDocs[id]||{}, data={}, any=false;
    if(!W.date){data.date=L.date;data.day=L.day;data.startedAt=L.startedAt;if(L.endedAt)data.endedAt=L.endedAt;if(L.manual)data.manual=true;any=true;}
    var log={};
    Object.keys(L.log).forEach(function(k){if(!(W.log&&W.log[k])){log[k]=L.log[k];any=true;}});
    if(Object.keys(log).length)data.log=log;
    var n={};
    Object.keys(L.notes||{}).forEach(function(e){if(!(W.notes&&(e in W.notes))){n[e]=L.notes[e];any=true;}});
    if(Object.keys(n).length)data.notes=n;
    if(any)ops.push({id:id,data:data});
  });
  lsSet("tdl_ops",ops); flush();
}
function afterSnap(){
  rebuild();
  if(loadedW&&loadedL){if(!adopted){adopted=true;adopt();rebuild();drafts={};}reconcile();}
  refreshSync(); scheduleRender();
}
(async function(){
  var c=window.claude;
  if(!c||!c.use){startLocal();return;}
  c.use("downloads").then(function(x){dl=x;}).catch(function(){dl=null;});
  c.use("mcp").then(function(x){mcp=x;scheduleRender();}).catch(function(){mcp=null;});
  try{db=await c.use("db");}catch(e){db=null;}
  if(!db){startLocal();return;}
  mode="cloud";
  var lk=Object.keys(localDocs);
  if(lk.length){lk.forEach(function(id){ops.push({id:id,data:localDocs[id]});});localDocs={};lsSet("tdl_local",localDocs);lsSet("tdl_ops",ops);}
  refreshSync(); flush();
  function onErr(err){refreshSync();scheduleRender();}
  db.collection("workouts").limit(1000).onSnapshot(function(snap){
    var m={}; snap.docs.forEach(function(d){if(d.exists)m[d.id]=clone(d.data());}); wDocs=m; loadedW=true; afterSnap();
  },onErr);
  db.collection("sessions").limit(1000).onSnapshot(function(snap){
    var m={}; snap.docs.forEach(function(d){if(d.exists)m[d.id]=clone(d.data());}); lDocs=m; loadedL=true; afterSnap();
  },onErr);
})();
setTimeout(function(){if(mode==="connecting")startLocal();},12000);
})();
